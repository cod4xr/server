name: Rust quality and compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show
      - name: Test script suite registration policy
        run: python tools/test_script_test_targets.py
      - name: Test native local-scope trace admission
        run: |
          python tools/test_local_scope_vectors.py
          python tools/test_local_scope_emission_vectors.py
          python tools/test_local_scope_loop_emission_vectors.py
      - name: Check repository boundaries and source sizes
        run: python tools/check_repository.py
      - name: Check independent archive fixtures
        run: python tools/generate_archive_fixtures.py --check
      - name: Check independent endpoint cookie fixtures
        run: python tools/generate_cookie_vectors.py --check
      - name: Check independent fastfile fixtures
        run: python tools/generate_fastfile_fixtures.py --check
      - name: Check independent zone prefix fixtures
        run: python tools/generate_zone_fixtures.py --check
      - name: Check independent raw-file collections
        run: python tools/generate_rawfile_fixtures.py --check
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test debug build
        run: cargo test --workspace --locked
      - name: Test release build
        run: cargo test --workspace --release --locked
      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked

  upstream-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out pinned reference source
        run: |
          git clone --no-checkout https://github.com/callofduty4x/CoD4x_Server.git reference
          git -C reference checkout --detach ddd65fce1a1093017bad2dbb6840d75d11c0d56f
      - name: Install pinned formatter for generated data
        run: rustup show
      - name: Install x86 assembly fixture tool
        run: sudo apt-get update && sudo apt-get install --yes nasm
      - name: Verify source-grounded compatibility fixtures
        run: |
          python tools/generate_message_vectors.py reference --check
          python tools/generate_wire_vectors.py reference --check
          python tools/generate_huffman_vectors.py reference --check
          python tools/generate_obfuscation_vectors.py reference --check
          python tools/generate_content_vectors.py reference --check
          python tools/generate_user_command_vectors.py reference --check
          python tools/generate_bsp_vectors.py reference --check
          python tools/generate_zone_pointer_vectors.py reference --check
          python tools/generate_script_vectors.py reference --check
          python tools/generate_identifier_vectors.py reference --check
          python tools/generate_numeric_vectors.py reference --check
          python tools/generate_string_operation_vectors.py reference --check
          python tools/generate_arithmetic_vectors.py reference --check
          python tools/generate_vector_vectors.py reference --check
          python tools/generate_vector_index_vectors.py reference --check
          python tools/generate_undefined_vectors.py reference --check
          python tools/generate_function_reference_vectors.py reference --check
          python tools/generate_predicate_vectors.py reference --check
          python tools/script_predicate_reference.py reference
          python tools/generate_string_value_vectors.py reference --check
          python tools/generate_lexical_tables.py reference --check
          python tools/generate_literal_vectors.py reference --check
          python tools/generate_syntax_tables.py reference --check
          python tools/generate_array_vectors.py reference --check
          python tools/script_array_reference.py reference
          python tools/script_array_write_reference.py reference
          python tools/generate_array_alias_vectors.py reference --check
          python tools/script_array_alias_reference.py reference
          python tools/generate_array_lifetime_vectors.py reference --check
          python tools/script_array_lifetime_reference.py reference
          python tools/generate_array_read_vectors.py reference --check
          python tools/script_array_read_reference.py reference
          python tools/generate_script_path_vectors.py reference --check
          python tools/script_path_reference.py reference
          python tools/script_package_reference.py reference
          python tools/script_include_reference.py reference
          python tools/script_root_reference.py reference
          python tools/script_empty_array_reference.py reference
          python tools/script_local_scope_reference.py reference
          python tools/generate_local_scope_vectors.py reference --check
          python tools/generate_local_scope_emission_vectors.py reference --check
          python tools/generate_local_scope_loop_emission_vectors.py reference --check
          python tools/generate_string_access_vectors.py reference --check
          python tools/generate_object_size_vectors.py reference --check
          python tools/generate_struct_vectors.py reference --check
          python tools/script_struct_reference.py reference
          python tools/generate_field_vectors.py reference --check
          python tools/script_field_reference.py reference
          python tools/script_field_update_reference.py reference
          python tools/generate_object_comparison_vectors.py reference --check
          python tools/script_object_comparison_reference.py reference
          python tools/script_string_access_reference.py reference
          python tools/generate_defined_vectors.py reference --check
          python tools/script_defined_reference.py reference
